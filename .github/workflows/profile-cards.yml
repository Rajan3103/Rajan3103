name: Generate Profile Cards

# Builds every image the profile README shows from your own GitHub data and
# saves them in this repo, so nothing depends on a shared public server.
#   profile/terminal.svg                    -> terminal-style stats card
#   profile-3d-contrib/profile-amber-city.svg -> 3D contribution city

on:
  schedule:
    - cron: "0 0 * * *" # Runs every day at midnight UTC
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      # Uses the STATS_TOKEN secret if you add one, otherwise the built-in
      # token. Only PUBLIC repositories are ever listed on the card.
      - name: Generate terminal stats card
        env:
          GITHUB_TOKEN: ${{ secrets.STATS_TOKEN || secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}
        run: python3 .github/scripts/terminal_card.py profile/terminal.svg

      - name: Generate 3D contribution city
        uses: yoshi389111/github-profile-3d-contrib@v0.9.3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}
          SETTING_JSON: .github/profile-3d-amber.json

      - name: Commit & push the generated images
        run: |
          git config user.name github-actions
          git config user.email github-actions@users.noreply.github.com
          git add -A profile profile-3d-contrib
          if git commit -m "Update profile cards"; then
            git push
          fi
